<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workpads</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workpads">
  <meta name="theme-color" content="#1a3055">
  <link rel="apple-touch-icon" href="/img/icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,400&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    (function(){
      var t = localStorage.getItem('wp_theme') || 'telegram';
      if (t !== 'telegram') document.documentElement.setAttribute('data-theme', t);
      var b = localStorage.getItem('wp_bg') || 'americana';
      if (b !== 'americana') document.documentElement.setAttribute('data-bg', b);
    }());
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <div id="shell">

    <!-- ── Three-column content area ───────────────────────── -->
    <div id="content">

      <!-- Left panel: Records -->
      <aside id="panel-left" class="panel">
        <div class="panel-header">
          <button class="panel-title" id="panel-left-title" title="Show all records">Records</button>
          <button class="panel-toggle" id="toggle-left" title="Collapse panel" aria-label="Collapse records panel">
            <span class="toggle-icon">‹</span>
          </button>
        </div>
        <div class="panel-body" id="panel-left-body">
          <!-- WorkpadsPanel.js renders here -->
        </div>
        <div class="panel-collapsed-label" aria-hidden="true">Records</div>
        <div class="left-panel-footer">
          <div class="lpf-stats">
            <span class="lpf-archive-link" id="lpf-archive-link">0 archived</span>
            <button class="lpf-settings-link" id="lpf-settings-btn">Settings</button>
          </div>
          <button class="btn-primary lpf-new-btn" id="lpf-new-workpad">+ New Workpad</button>
        </div>
      </aside>

      <!-- Main screen area -->
      <main id="main-area">
        <div id="main-topbar">
          <div class="main-topbar-left">
            <button id="mobile-btn-left" class="mobile-nav-btn mobile-nav-records" title="Open records panel" aria-label="Records"></button>
            <button id="btn-new" class="mobile-nav-btn mobile-nav-new" title="New workpad" aria-label="New workpad">+</button>
            <button id="mobile-btn-import" class="mobile-nav-btn mobile-nav-import" title="Import from link" aria-label="Import from link">&#8595;</button>
            <span id="main-topbar-breadcrumb" class="main-topbar-breadcrumb"></span>
          </div>
          <div class="main-topbar-right">
            <div class="view-variant-group" id="view-variant-group" style="display:none;">
              <button class="view-variant-btn" data-variant="compact" title="Compact view">A</button>
              <button class="view-variant-btn active" data-variant="default" title="Default view">1</button>
              <button class="view-variant-btn" data-variant="large" title="Large view">a</button>
            </div>
            <button id="mobile-btn-note" class="mobile-nav-btn mobile-nav-note" title="Quick note" aria-label="Quick note">&#9998;</button>
            <button id="mobile-btn-right" class="mobile-nav-btn mobile-nav-personal" title="Open personal panel" aria-label="Personal"></button>
          </div>
        </div>
        <div id="screen-onboarding" class="screen"></div>
        <div id="screen-list"       class="screen"></div>
        <div id="screen-wizard"     class="screen"></div>
        <div id="screen-view"       class="screen"></div>
        <div id="screen-share"      class="screen"></div>
        <div id="screen-management" class="screen"></div>
        <div id="screen-archive"    class="screen"></div>
        <div id="screen-financial"         class="screen"></div>
        <div id="screen-finance-overview"  class="screen"></div>
      </main>

      <!-- Right panel: Personal -->
      <aside id="panel-right" class="panel">
        <div class="panel-header panel-header-right">
          <button class="panel-toggle" id="toggle-right" title="Collapse panel" aria-label="Collapse personal panel">
            <span class="toggle-icon">›</span>
          </button>
          <span class="panel-title">Personal</span>
        </div>
        <div class="panel-body" id="panel-right-body">
          <!-- PersonalPanel.js renders here -->
        </div>
        <div class="panel-collapsed-label" aria-hidden="true">Personal</div>
      </aside>

    </div><!-- #content -->

  </div><!-- #shell -->

  <!-- ── Onboarding overlay ─────────────────────────────────── -->
  <div id="overlay-onboarding" class="overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="onboard-heading">
    <div class="overlay-card">
      <div class="overlay-wordmark"><img src="/img/at-workpads.png" alt="@workpads" class="overlay-wordmark-img"></div>
      <h1 class="overlay-heading" id="onboard-heading">Your records,<br>on your device.</h1>
      <p class="overlay-sub">No account. No server. Everything lives right here, in your personal browser.</p>
      <div class="field-group">
        <label class="field-label" for="onboard-name">Your name <span class="field-required">*</span></label>
        <input class="field-input" id="onboard-name" type="text" placeholder="e.g. Alice Smith" autocomplete="name" autocorrect="off">
      </div>
      <div class="field-group">
        <label class="field-label" for="onboard-phone">Phone / WhatsApp <span class="field-optional">(optional)</span></label>
        <input class="field-input" id="onboard-phone" type="tel" placeholder="e.g. +44 7700 900123" autocomplete="tel">
      </div>
      <button class="btn-primary btn-full" id="onboard-submit">Start sending workpads</button>
      <p class="overlay-footnote">Your name appears on records you create. You can change it later in settings.</p>
    </div>
  </div>

  <!-- ── Quick note overlay ─────────────────────────────────── -->
  <div id="overlay-quicknote" class="overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="quicknote-heading">
    <div class="overlay-card overlay-card-sm">
      <h2 class="overlay-heading-sm" id="quicknote-heading">Quick note</h2>
      <textarea class="field-input field-textarea" id="quicknote-input" placeholder="Capture a thought…" rows="5"></textarea>
      <div class="overlay-actions">
        <button class="btn-ghost" id="quicknote-cancel">Cancel</button>
        <button class="btn-primary" id="quicknote-save">Save note</button>
      </div>
    </div>
  </div>

  <!-- ── Note detail overlay ────────────────────────────────── -->
  <div id="overlay-note-detail" class="overlay" style="display:none;" role="dialog" aria-modal="true">
    <div class="overlay-card overlay-card-sm">
      <div class="overlay-note-header">
        <span class="overlay-note-time" id="overlay-note-time"></span>
        <div style="display:flex;gap:8px;align-items:center;">
          <button id="overlay-note-edit" style="font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--ink-mid);background:var(--rule-light);border:1px solid var(--rule);border-radius:3px;padding:3px 9px;cursor:pointer;">Edit</button>
          <button id="overlay-note-copy" style="font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--ink-mid);background:var(--rule-light);border:1px solid var(--rule);border-radius:3px;padding:3px 9px;cursor:pointer;">Copy</button>
          <button class="btn-icon" id="overlay-note-close" aria-label="Close">&times;</button>
        </div>
      </div>
      <div class="overlay-note-body" id="overlay-note-body"></div>
      <div id="overlay-note-edit-area" style="display:none;">
        <textarea id="overlay-note-edit-input" class="field-input field-textarea" rows="5" style="margin-bottom:10px;"></textarea>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button class="btn-ghost" id="overlay-note-edit-cancel">Cancel</button>
          <button class="btn-primary" id="overlay-note-edit-save">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Import / paste link overlay ─────────────────────────── -->
  <div id="overlay-import" class="overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="import-heading">
    <div class="overlay-card overlay-card-sm">
      <h2 class="overlay-heading-sm" id="import-heading">Add from link</h2>
      <div id="import-preview" class="import-preview" style="display:none;"></div>
      <div class="field-group" id="import-paste-group">
        <label class="field-label" for="import-url-input">Paste a workpads link</label>
        <input class="field-input" id="import-url-input" type="url" placeholder="workpads.me/p#&#x2026;" autocomplete="off" autocorrect="off" spellcheck="false">
      </div>
      <div id="import-error" style="display:none;font-family:var(--font-mono);font-size:11px;color:#b33a0a;margin:8px 0;"></div>
      <div class="overlay-actions">
        <button class="btn-ghost" id="import-cancel">Cancel</button>
        <button class="btn-primary" id="import-save" disabled>Save as new workpad</button>
      </div>
    </div>
  </div>

  <!-- ── Scripts ───────────────────────────────────────────── -->
  <script src="js/lib/fflate.js"></script>
  <script src="js/lib/codec.js"></script>
  <script src="js/services/StorageAdapter.js"></script>
  <script src="js/services/ActivityService.js"></script>
  <script src="js/services/RecordService.js"></script>
  <script src="js/services/PersonalService.js"></script>
  <script src="js/services/BlockRegistry.js"></script>
  <script src="js/screens/list.js"></script>
  <script src="js/screens/wizard.js"></script>
  <script src="js/screens/view.js"></script>
  <script src="js/screens/share.js"></script>
  <script src="js/screens/management.js"></script>
  <script src="js/screens/archive.js"></script>
  <script src="js/screens/financial.js"></script>
  <script src="js/screens/finance-overview.js"></script>
  <script src="js/panels/WorkpadsPanel.js"></script>
  <script src="js/panels/PersonalPanel.js"></script>
  <script src="js/app.js"></script>
  <script>
    /* ── Panel footer wiring ── */
    (function () {
      /* Left footer: New Workpad */
      var newBtn = document.getElementById('lpf-new-workpad');
      if (newBtn) newBtn.addEventListener('click', function () { App.showWizard(); });

      /* Left footer: archive link + count */
      var archLink = document.getElementById('lpf-archive-link');
      if (archLink) {
        archLink.addEventListener('click', function () { App.showArchive(); });
        function refreshArchiveCount() {
          if (typeof RecordService !== 'undefined' && RecordService.listArchived) {
            RecordService.listArchived().then(function (r) {
              archLink.textContent = (r || []).length + ' archived';
            });
          }
        }
        refreshArchiveCount();
        setInterval(refreshArchiveCount, 8000);
      }

      /* Left footer: Settings link */
      var settingsBtn = document.getElementById('lpf-settings-btn');
      if (settingsBtn) settingsBtn.addEventListener('click', function () { App.showManagement('settings'); });

      /* Center topbar breadcrumb */
      window.setTopbarBreadcrumb = function (text) {
        var el = document.getElementById('main-topbar-breadcrumb');
        if (el) el.textContent = text || '';
      };
    }());
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>

</body>
</html>
